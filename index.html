<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>濃度学習 追加調査</title><style>*{box-sizing:border-box}body{font:17px/1.65 system-ui,sans-serif;background:#eef2f6;color:#172638;margin:0}main{max-width:900px;margin:25px auto;padding:24px;background:white;border-radius:14px}h1{font-size:26px}h2{font-size:21px}button,input,select,textarea{font:inherit}button{background:#175a92;color:white;border:0;border-radius:8px;padding:12px 22px;cursor:pointer}button.secondary{background:#526474}input,select,textarea{border:1px solid #aab8c6;border-radius:6px;padding:8px}textarea{width:100%;min-height:100px}section{border-bottom:1px solid #dbe3eb;padding:16px 0}.bar{position:sticky;top:0;background:#e5eff8;padding:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}.muted{color:#526474}label{display:block;margin:8px 0}button:disabled{opacity:.5} .nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{min-width:50px}input:focus,textarea:focus{outline:2px solid #175a92} </style><main id="app"></main><script>
const questions=[["問1　食塩18 gを水72 gに完全に溶かした。できた食塩水の質量は何gか。", "問2　食塩18 gを水72 gに完全に溶かした。質量パーセント濃度は何％か。式も書きなさい。", "問3　食塩40 gを水210 gに完全に溶かした。質量パーセント濃度は何％か。", "問4　6％の食塩水250 gに含まれる食塩は何gか。", "問5　14％の食塩水200 gに水200 gを加えた。新しい濃度は何％か。", "問6　9％の食塩水300 gから水だけが150 g蒸発した。食塩はすべて溶けたままとする。濃度は何％か。", "問7　食塩水A（食塩12 g、水88 g）と食塩水B（食塩36 g、水264 g）について、正しいものを選びなさい。"], ["問8　食塩15 g、水135 gの食塩水と、食塩15 g、水60 gの食塩水では、どちらが濃いか。理由も説明しなさい。", "問9　8％の食塩水250 gに食塩20 gを加え、すべて溶かした。「濃度は16％になる」という考えは正しいか。計算を用いて説明しなさい。", "問10　「食塩水の量が4倍になれば、濃度も4倍になる」という説明が必ずしも正しくないことを、食塩と水の質量を具体的に示して説明しなさい。"]];const app=document.getElementById('app'), limits=[600,900], keys=['A','B'], correct=[90,20,16,15,7,18,'ウ'];
let student={}, results=[], phase=0, idx=0, answers={}, times=[], visits=[], changes={}, start=0, entered=0, timer=null, active=false;
const $=id=>document.getElementById(id); const n=()=>phase?idx+8:idx+1;
function home(){app.innerHTML=`<h1>質量パーセント濃度　追加調査（本調査）</h1><p>A問題：7問・10分　／　B問題：3問・15分</p><p>電卓は使用しないでください。前の問題に戻って修正できます。見直しを終えたら終了してください。</p><label>組 <select id="cls"><option value="">選択</option>${[1,2,3,4].map(x=>`<option>${x}</option>`).join('')}</select></label><label>調査ID（氏名は入力しない） <input id="sid" autocomplete="off"></label><button id="go">A問題を開始</button>`;$('go').onclick=()=>{if(!$('cls').value||!$('sid').value.trim())return alert('組と調査IDを入力してください。');student={c:$('cls').value,s:$('sid').value.trim()};begin(0)}}
function begin(p){phase=p;idx=0;answers={};changes={};times=questions[p].map(()=>0);visits=questions[p].map(()=>0);active=true;start=performance.now();entered=start;visits[0]++;render();timer=setInterval(tick,100)}
function accrue(){const now=Math.min(performance.now(),start+limits[phase]*1000);times[idx]+=Math.max(0,now-entered);entered=now}
function move(i){if(!active)return;accrue();idx=i;visits[idx]++;render()}
function render(){let q=n();app.innerHTML=`<div class="bar"><strong>${keys[phase]}問題　${idx+1} / ${questions[phase].length}</strong><span id="clock"></span></div><p class="muted">問題番号を選ぶと移動できます。入力内容は保持されます。</p><div class="nav">${questions[phase].map((_,i)=>`<button class="${i===idx?'':'secondary'}" data-nav="${i}">${phase?i+8:i+1}${(answers[phase?i+8:i+1]||'').trim()?' ✓':''}</button>`).join('')}</div><section><h2>${questions[phase][idx]}</h2>${phase?`<textarea data-key="${q}" aria-label="解答" style="min-height:220px"></textarea>`:q===7?['ア　Aの方が濃い','イ　Bの方が濃い','ウ　同じ濃度'].map(v=>`<label><input type="radio" name="q7" data-key="7" value="${v[0]}"> ${v}</label>`).join(''):`<label>答え <input data-key="${q}" inputmode="decimal"> ${[1,4].includes(q)?'g':'％'}</label><label>途中式${q===2?'（記入してください）':'（必要に応じて）'}<textarea data-key="${q}式"></textarea></label>`}</section><div class="nav"><button class="secondary" id="prev" ${idx===0?'disabled':''}>前の問題</button><button id="next" ${idx===questions[phase].length-1?'disabled':''}>次の問題</button></div><p><button class="secondary" id="finish">${keys[phase]}問題を終了する</button></p><div id="confirm"></div>`;
app.querySelectorAll('[data-key]').forEach(el=>{let k=el.dataset.key;if(el.type==='radio')el.checked=answers[k]===el.value;else el.value=answers[k]||'';el.addEventListener('input',()=>{if(!active)return;if(performance.now()-start>=limits[phase]*1000){finish(true);return;}answers[k]=el.value;changes[k]=(changes[k]||0)+1})});app.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>move(+el.dataset.nav));$('prev').onclick=()=>move(idx-1);$('next').onclick=()=>move(idx+1);$('finish').onclick=()=>{$('confirm').innerHTML='<p>終了すると戻れません。見直しは済みましたか？</p><button id="yes">終了を確定</button> <button class="secondary" id="no">解答に戻る</button>';$('yes').onclick=()=>finish(false);$('no').onclick=()=>{$('confirm').innerHTML=''}};tick();window.scrollTo(0,0)}
function tick(){if(!active)return;let rem=limits[phase]-(performance.now()-start)/1000,t=Math.max(0,Math.ceil(rem));if($('clock'))$('clock').textContent=`残り ${Math.floor(t/60)}分${String(t%60).padStart(2,'0')}秒`;if(rem<=0)finish(true)}
function finish(timeout){if(!active)return;accrue();active=false;clearInterval(timer);let elapsed=Math.min(limits[phase],(performance.now()-start)/1000);results.push({sec:elapsed.toFixed(1),timeout:timeout||elapsed>=limits[phase],answers:{...answers},times:times.map(t=>(t/1000).toFixed(1)),visits:[...visits],changes:{...changes}});if(phase===0){app.innerHTML='<h1>A問題終了</h1><p>先生の指示があるまで待ってください。</p><button id="next">B問題を開始（15分）</button>';$('next').onclick=()=>begin(1)}else{app.innerHTML='<h1>調査終了</h1><p>A・B両方の解答を記録しました。CSVを保存して提出してください。</p><button id="save">結果CSVを保存</button>';$('save').onclick=save}window.scrollTo(0,0)}
function save(){let [a,b]=results,h=['組','調査ID','群','A秒','A状態','B秒','B状態'],v=[student.c,student.s,+student.c<=2?'対照区':'実験区',a.sec,a.timeout?'時間切れ':'終了',b.sec,b.timeout?'時間切れ':'終了'];let total=0;for(let i=1;i<=10;i++){let r=i<=7?a:b,j=i<=7?i-1:i-8,x=r.answers[i]||'';h.push('問'+i+'解答','問'+i+'途中式','問'+i+'表示秒','問'+i+'訪問回数','問'+i+'入力イベント数','問'+i+'無解答','問'+i+'暫定点');let score=i<=7?(x.trim()!==''&&(i===7?x===correct[i-1]:Number(x.normalize('NFKC'))===correct[i-1])?5:0):'';if(i<=7)total+=score;v.push(x,r.answers[i+'式']||'',r.times[j],r.visits[j],(r.changes[i]||0)+(r.changes[i+'式']||0),x.trim()?'0':'1',score)}h.push('A暫定合計','B手動採点合計');v.push(total,'');let esc=x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/, m=>"'"+m).replaceAll('"','""')+'"';let blob=new Blob(['\ufeff'+[h,v].map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='濃度本調査_'+student.c+'組_'+student.s.replace(/[^a-zA-Z0-9_-]/g,'_')+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
window.addEventListener('beforeunload',e=>{if(active||results.length===1){e.preventDefault();e.returnValue=''}});home();</script></html>
